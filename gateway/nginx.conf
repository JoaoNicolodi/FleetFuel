# API Gateway do FleetFuel: ponto único de entrada para o Portal Web e o App Mobile.
# Roteia por prefixo e faz o upgrade de conexão para WebSocket.

worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  client_max_body_size 10m;   # foto do hodômetro em base64

  # Proteção básica contra abuso na rota de abastecimento (por IP).
  limit_req_zone $binary_remote_addr zone=refuels:10m rate=30r/s;
  limit_req_status 429;   # o app trata 429 como erro transitório e tenta de novo

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream core_service  { server core-service:3001; }
  upstream live_service  { server live-service:3002; }
  upstream audit_service { server audit-service:3003; }
  upstream web_portal    { server web:80; }

  log_format gateway '$remote_addr "$request" $status $request_time s -> $upstream_addr';
  access_log /dev/stdout gateway;

  server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id      $request_id;

    location = /health { return 200 'gateway ok'; add_header Content-Type text/plain; }

    location /api/core/refuels {
      limit_req zone=refuels burst=60 nodelay;
      rewrite ^/api/core/(.*)$ /$1 break;
      proxy_pass http://core_service;
    }

    location /api/core/  { proxy_pass http://core_service/; }
    location /api/live/  { proxy_pass http://live_service/; }
    location /api/audit/ { proxy_pass http://audit_service/; }

    # WebSocket do painel em tempo real (Serviço B)
    location /ws {
      proxy_pass http://live_service/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    location / { proxy_pass http://web_portal; }
  }
}
